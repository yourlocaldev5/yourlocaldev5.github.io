<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style id="app-style">/* Look: a tall dark header with two rows of links and an accent call-to-action block, a pale notice strip, a dark hero,
   a three-link band, dark page-header bands with an accent rule, bordered white cards on an off-white page, condensed
   uppercase headings, rectangular buttons, numbered steps and an accent side card. Colour is kept to two hues per theme:
   a dark colour and one accent, plus pale neutral tints. One committed light look; each season swaps the two colours and
   adds an ornament plus falling particles. */
:root{color-scheme:light;--font-head:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--font-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--ok:#007A55;--warn:#A15C00;--bad:#B42318;--infobg:#EFF6FF;--infoink:#162456;--dark:#13213B;--darker:#0C1628;--dark2:#1C2E4F;--gold:#46B4FF;--gold2:#6CC4FF;--sage:#C5D3E8;--banner:#E2EBF7;--page:#F5F7FB;--soft:#EDF2FA;--ink:#0C1628;--muted:#465770;--mdark:#93A8C8;--dline:#2B4064;--ongold:#08111F;--goldtext:#0B63B0;--fx1:#46B4FF;--fx2:#C5D3E8;--fx3:#93A8C8}
:root[data-season="halloween"]{--dark:#22132F;--darker:#150B20;--dark2:#2E1A40;--gold:#FF7A1A;--gold2:#FF9440;--sage:#DCCFE8;--banner:#EEE5F5;--page:#F8F5F2;--soft:#F3EEF7;--ink:#150B20;--muted:#5B4A6B;--mdark:#B3A0C9;--dline:#3F2A57;--ongold:#150B20;--goldtext:#A34400;--fx1:#9B6BFF;--fx2:#FF7A1A;--fx3:#FFC24D}
:root[data-season="fall"]{--dark:#33221A;--darker:#22150F;--dark2:#432C21;--gold:#E8A33D;--gold2:#F2B552;--sage:#E0CFBA;--banner:#F2E7D6;--page:#FAF5EC;--soft:#F5ECDD;--ink:#22150F;--muted:#6A5444;--mdark:#C3A98F;--dline:#513A2C;--ongold:#22150F;--goldtext:#8A5200;--fx1:#E8590C;--fx2:#F2B134;--fx3:#B5476B}
:root[data-season="christmas"]{--dark:#7A1626;--darker:#4F0E19;--dark2:#85202F;--gold:#E3B23C;--gold2:#F0C453;--sage:#E8CFCF;--banner:#F6E0E0;--page:#FBF6F0;--soft:#F9EEEA;--ink:#3A0C14;--muted:#6B4B4F;--mdark:#E8B7BD;--dline:#94303F;--ongold:#3A0C14;--goldtext:#865A00;--fx1:#A9C7EE;--fx2:#FFFFFF;--fx3:#E3B23C}
:root[data-season="spring"]{--dark:#0D4A56;--darker:#08343D;--dark2:#135D6B;--gold:#FFCB3D;--gold2:#FFD966;--sage:#C8E2E4;--banner:#E0F0F1;--page:#F3FAFA;--soft:#E8F5F5;--ink:#08343D;--muted:#3F6068;--mdark:#A6D3D8;--dline:#1B6676;--ongold:#08343D;--goldtext:#7A5B00;--fx1:#FF6FA5;--fx2:#FFB300;--fx3:#38BDF8}
:root{
  --wrap:1320px;--gut:16px;--stick:12px;
  --ondark:color-mix(in srgb,#fff 82%,var(--dark));
  --field:color-mix(in srgb,var(--ink) 48%,#fff);
}
@media (min-width:720px){:root{--gut:28px}}
@media (min-width:1100px){:root{--gut:36px}}
@media (max-width:1040px){:root{--stick:78px}}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--page);color:var(--ink);font:400 17px/1.6 var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--darker);z-index:60}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0}
a{color:inherit}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
i,em{font-style:normal}
code,pre{font-family:var(--font-mono)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hdr :focus-visible,.hero :focus-visible,.ctaband :focus-visible,.ftr :focus-visible,.lband :focus-visible,.phead :focus-visible{outline-color:#fff}
::selection{background:var(--gold);color:var(--ongold)}

.wrap{width:100%;max-width:calc(var(--wrap) + 2 * var(--gut));margin-inline:auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-999px;top:0;background:var(--gold);color:var(--ongold);padding:.6rem 1rem;z-index:100;font-weight:700}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.ico{width:1.15em;height:1.15em;flex:none}

/* ---------- utilities */
.stack{display:grid;gap:10px;align-content:start}
.stack-lg{display:grid;gap:28px;align-content:start}
.stack-sm{display:grid;gap:4px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:15px}
.mono{font-family:var(--font-mono)}
.grow{flex:1;min-width:0}
.more{margin-top:22px;font-weight:700}
.more a{display:inline-flex;gap:8px;align-items:center;text-decoration:none;border-bottom:2px solid var(--gold);padding-bottom:2px}
.k,.hk{font:700 12px/1.2 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--goldtext)}
.hk{color:var(--muted)}
.eyebrow{font:700 13px/1.2 var(--font-body);letter-spacing:.18em;text-transform:uppercase;color:var(--goldtext)}
.lede{font-size:clamp(17px,1.5vw,20px);color:var(--muted);max-width:62ch}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--gold);color:var(--ongold);font:700 13px/1.3 var(--font-body);letter-spacing:.02em;border-radius:2px;white-space:nowrap}
.chip.ok{background:var(--soft);color:var(--ok);box-shadow:inset 0 0 0 1px var(--sage)}
.chip.hot{background:var(--dark);color:#fff}

/* ---------- buttons: rectangular, condensed, uppercase */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 24px;border:2px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);font:700 18px/1 var(--font-head);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .15s,color .15s,border-color .15s;text-align:center}
.btn:hover{background:var(--ink);color:#fff}
.btn .ico{width:18px;height:18px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--ongold)}
.btn.primary:hover{background:var(--gold2);border-color:var(--gold2);color:var(--ongold)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.dark:hover{background:var(--darker);border-color:var(--darker)}
.btn.ghost{border-color:#fff;color:#fff}
.btn.ghost:hover{background:#fff;color:var(--dark)}
.btn.sm{min-height:38px;padding:0 16px;font-size:15px}
.btn.lg{min-height:58px;padding:0 34px;font-size:22px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--ink)}
.btn.primary:disabled:hover{background:var(--gold);color:var(--ongold)}

/* ---------- header: tall, two rows, accent call-to-action block */
.hdr{background:var(--dark);color:#fff;border-bottom:3px solid var(--gold);position:relative;z-index:50}
.hdr-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:44px 84px;align-items:stretch}
.brand{grid-column:1;grid-row:1 / span 2;display:flex;align-items:center;gap:16px;padding:10px 40px 12px 0;color:#fff;text-decoration:none;min-width:0}
.brand svg.logo{width:88px;height:88px;flex:none;color:#fff}
.bname{display:grid;gap:5px;line-height:1;min-width:0}
.b1{font:700 30px/1 var(--font-head);letter-spacing:.015em}
.b2{font:700 13px/1 var(--font-body);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.nav{display:contents}
.nav a{color:#fff;text-decoration:none;font:700 15px/1 var(--font-body);letter-spacing:.07em;text-transform:uppercase;position:relative;display:flex;align-items:center}
.nav a:hover{color:var(--gold)}
.nav-util{grid-column:2;grid-row:1;display:flex;align-items:center;gap:32px;border-bottom:1px solid var(--dline)}
.nav-main{grid-column:2;grid-row:2;display:flex;align-items:stretch;gap:6px;padding-bottom:12px}
.nav-main a{padding:0 20px 4px}
.nav-main a:first-child{padding-left:0}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gold)}
.nav-util a[aria-current="page"]::after{bottom:-1px}
.nav-adm{display:none!important}
.hdr-tag{grid-column:3;grid-row:1;display:flex;align-items:center;justify-content:flex-end;padding-left:28px;border-bottom:1px solid var(--dline);font:700 13px/1 var(--font-body);letter-spacing:.22em;text-transform:uppercase;color:var(--mdark);white-space:nowrap}
.hdr-r{grid-column:3;grid-row:2;display:flex;align-items:stretch;gap:22px;padding-bottom:12px}
.uchip{display:flex;align-items:center;gap:12px;align-self:center;color:#fff;text-decoration:none;position:relative}
.uav{width:42px;height:42px;border-radius:50%;background:var(--dark2);border:2px solid var(--dline);display:grid;place-items:center;flex:none}
.uav svg{width:24px;height:24px}
.un{font:700 18px/1 var(--font-body);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.ub{font:700 12px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:var(--ongold);padding:5px 8px;border-radius:2px}
.uchip>.ico{width:16px;height:16px;color:var(--ondark)}
.uchip:hover .un{color:var(--gold)}
.uchip.dirty .uav{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.hcta{display:flex;align-items:center;justify-content:center;gap:10px;padding:0 32px;background:var(--gold);color:var(--ongold);font:700 21px/1 var(--font-head);letter-spacing:.11em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.hcta:hover{background:var(--gold2)}
.hcta .ico{display:none;width:20px;height:20px}
.menu-btn{display:none;width:46px;height:46px;border:1px solid var(--dline);background:transparent;color:#fff;cursor:pointer;place-items:center;border-radius:0}
.menu-btn .ico{width:24px;height:24px}

/* ---------- notice strip */
.banner{background:var(--banner);color:var(--ink);border-bottom:1px solid var(--sage)}
.banner .wrap{display:flex;align-items:center;gap:16px;padding-block:11px}
.banner .ico{width:20px;height:20px}
.banner p{flex:1;text-align:center;font:600 15px/1.5 var(--font-body)}
.banner .ico+p{margin-right:36px}

/* ---------- hero */
.hero{position:relative;overflow:hidden;isolation:isolate;color:#fff;background:radial-gradient(ellipse 90% 100% at 50% 0%,var(--dark2) 0%,var(--dark) 52%,var(--darker) 100%)}
.hero-bg{position:absolute;inset:0;z-index:-1;pointer-events:none}
.hero-bg .grid{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/64px 64px;-webkit-mask:radial-gradient(ellipse 70% 80% at 50% 45%,#000 20%,transparent 78%);mask:radial-gradient(ellipse 70% 80% at 50% 45%,#000 20%,transparent 78%)}
.hero-bg .wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;opacity:.055;line-height:0}
.hero-bg .wm svg{width:min(640px,86vw);height:auto}
.orn{position:absolute;inset:0;pointer-events:none;z-index:0}
.hero-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-block:clamp(52px,6.5vw,92px) clamp(48px,6vw,84px)}
.hero h1{font:800 clamp(46px,7vw,100px)/.98 var(--font-head);text-transform:uppercase;letter-spacing:.005em;max-width:20ch;text-wrap:balance}
.hero h1 em{color:var(--gold);display:block}
.hero .lede{color:var(--ondark);max-width:58ch;font-size:clamp(18px,1.7vw,22px);line-height:1.5}
.status{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border:1px solid var(--dline);background:rgba(0,0,0,.22);font:700 13px/1 var(--font-body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.sdot{width:9px;height:9px;border-radius:50%;background:#3CE08F;animation:ping 2.2s ease-out infinite}
.status.off{color:var(--ondark)}
.status.off .sdot{background:#E5484D;animation:none}
.ctas{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.facts{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 30px;margin-top:18px;color:var(--ondark);font-weight:600;font-size:16px}
.facts li{display:flex;align-items:center;gap:8px}
.facts .ico{color:var(--gold);width:18px;height:18px}
.hero.xmas .hero-in{padding-top:clamp(96px,12vw,170px)}

.moon{position:absolute;right:6%;top:26px;width:clamp(56px,9vw,120px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 32%,#FFF4D6,#F5B94D 72%);box-shadow:0 0 90px 26px rgba(255,150,40,.32)}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(190,120,20,.28)}
.moon::before{width:18%;aspect-ratio:1;left:54%;top:26%}
.moon::after{width:12%;aspect-ratio:1;left:30%;top:58%}
.autumn-sun{position:absolute;left:-80px;top:14%;width:560px;max-width:90vw;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--gold) 0%,transparent 66%);opacity:.26}
.sun{position:absolute;right:6%;top:-20px;width:clamp(90px,14vw,180px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--gold) 0 38%,transparent 39%)}
.sun::before{content:"";position:absolute;inset:-34%;border-radius:50%;background:repeating-conic-gradient(var(--gold) 0 4deg,transparent 4deg 18deg);opacity:.5;-webkit-mask:radial-gradient(circle,transparent 30%,#000 31%,#000 58%,transparent 59%);mask:radial-gradient(circle,transparent 30%,#000 31%,#000 58%,transparent 59%);animation:spin 80s linear infinite}
.lights{position:absolute;left:0;right:0;top:0;height:54px}
.lights svg{position:absolute;inset:0;width:100%;height:100%}
.lights svg path{fill:none;stroke:rgba(255,255,255,.6);stroke-width:2;vector-effect:non-scaling-stroke}
.lights i{position:absolute;width:12px;height:16px;margin-left:-6px;border-radius:50% 50% 55% 55%;background:var(--c);box-shadow:0 0 14px 3px var(--c);animation:tw 2.6s ease-in-out infinite;animation-delay:var(--d)}

/* ---------- link band under the hero */
.lband{background:var(--darker);border-top:3px solid var(--gold);color:#fff}
.lband-in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.lcard{display:block;padding:34px 36px 38px;color:#fff;text-decoration:none;border-left:1px solid var(--dline)}
.lcard:first-child{border-left:0;padding-left:0}
.lt{display:flex;align-items:center;justify-content:space-between;gap:16px}
.lt h3{font:700 clamp(30px,3vw,46px)/1 var(--font-head);text-transform:uppercase}
.lt .ico{width:28px;height:28px;transition:transform .15s,color .15s}
.lcard p{margin-top:10px;color:var(--ondark);font-size:19px;line-height:1.45}
.lcard:hover .lt .ico{transform:translateX(5px);color:var(--gold)}
.lcard:hover h3{color:var(--gold)}

/* ---------- page header band */
.phead{background:var(--dark);color:#fff;border-bottom:3px solid var(--gold)}
.phead-in{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding-block:clamp(34px,5vw,62px)}
.phead h1{font:800 clamp(42px,5.6vw,74px)/1 var(--font-head);text-transform:uppercase;letter-spacing:.005em}
.phead .lede{color:var(--ondark);font-size:clamp(17px,1.6vw,22px);margin-top:4px}
.phead .eyebrow{color:var(--gold)}
.phead-r{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- sections */
.sec{padding-block:clamp(40px,6vw,76px)}
.sec.tight{padding-block:clamp(24px,3.4vw,42px)}
.sec.adm-sec{padding-block:clamp(28px,4vw,48px) clamp(48px,6vw,80px)}
.sec-head{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:30px}
.sec-head h2,.sband h2,.cta h2{font:800 clamp(34px,4.6vw,58px)/1 var(--font-head);text-transform:uppercase;letter-spacing:.005em}
.sec-head .stack{gap:8px}

/* ---------- cards */
.card{background:#fff;border:1px solid var(--sage);border-radius:2px;padding:24px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.feat{display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.feat:hover{border-color:var(--dark)}
.feat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tile{width:50px;height:50px;background:var(--dark);color:var(--gold);display:grid;place-items:center;border-radius:2px;flex:none}
.tile .ico{width:26px;height:26px}
.feat h3,.know h3,.empty h3{font:800 27px/1.05 var(--font-head);text-transform:uppercase;margin-top:6px}
.feat p{font-size:17px}

/* ---------- numbered steps + accent card */
.split-steps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,430px);gap:clamp(32px,6vw,84px);align-items:start}
.steps{list-style:none;display:grid}
.steps li{position:relative;display:grid;grid-template-columns:50px minmax(0,1fr);gap:24px;padding-bottom:32px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:24px;top:58px;bottom:8px;width:3px;background:var(--sage)}
.steps li:last-child::before{display:none}
.num{width:50px;height:50px;border-radius:50%;background:var(--dark);color:#fff;font:700 24px/1 var(--font-head);display:grid;place-items:center}
.sbody h3{font:700 27px/1.1 var(--font-head);text-transform:uppercase;margin:8px 0 6px}
.sbody p{max-width:56ch}
.sticky{position:sticky;top:var(--stick)}
.gcard{background:var(--gold);color:var(--ongold);padding:30px;border-radius:2px;display:grid;gap:14px;align-content:start}
.gcard h3{font:800 clamp(30px,2.8vw,40px)/1 var(--font-head);text-transform:uppercase}
.gcard p{font-size:18px;line-height:1.45}
.gcard .small{font-size:15px}
.plist{list-style:none;display:grid;gap:9px;margin:2px 0 4px}
.plist li{display:flex;align-items:baseline;gap:8px;font-weight:600;font-size:17px}
.plist .dots{flex:1;min-width:12px;border-bottom:2px dotted color-mix(in srgb,var(--ongold) 45%,transparent);transform:translateY(-4px)}
.plist b{font-weight:700;white-space:nowrap}
.pmax{font-size:15px!important}
.gcard .btn{border-color:var(--ongold);color:var(--ongold)}
.gcard .btn:hover{background:var(--ongold);color:#fff}
.gcard .btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.gcard .btn.dark:hover{background:var(--darker);border-color:var(--darker)}

/* ---------- seasons band */
.sband{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:center;background:#fff;border:1px solid var(--sage);padding:clamp(24px,3vw,40px)}
.sband h2{font-size:clamp(30px,3.6vw,46px)}
.schips{display:flex;flex-wrap:wrap;gap:10px}
.schip{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 16px;border:1px solid var(--sage);background:var(--page);font:700 16px/1 var(--font-body);cursor:pointer;border-radius:2px}
.schip:hover{border-color:var(--dark)}
.schip[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:#fff}
.sw{display:inline-flex}
.sw i{width:15px;height:15px;border-radius:50%;margin-left:-5px;box-shadow:0 0 0 1.5px #fff}
.sw i:first-child{margin-left:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px}
.stile{display:grid;align-content:start;gap:6px;text-align:left;cursor:pointer;padding:0;overflow:hidden;font:inherit}
.stile b{font:800 24px/1.1 var(--font-head);text-transform:uppercase;padding:10px 18px 0}
.stile .d{padding:0 18px 18px;color:var(--muted);font-size:16px;line-height:1.4}
.stile:hover{border-color:var(--dark)}
.stile[aria-pressed="true"]{border-color:var(--dark);box-shadow:inset 0 0 0 2px var(--dark)}
.band-sw{display:flex;height:46px}
.band-sw i{flex:1}

/* ---------- FAQ */
.faq{background:#fff;border:1px solid var(--sage)}
.faq details{border-top:1px solid var(--sage)}
.faq details:first-child{border-top:0}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 24px;font:700 20px/1.3 var(--font-body)}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover{background:var(--soft)}
.faq summary .ico{width:22px;height:22px;transition:transform .2s}
.faq details[open] summary{background:var(--soft)}
.faq details[open] summary .ico{transform:rotate(180deg)}
.ans{padding:6px 24px 24px;max-width:78ch;color:var(--muted);font-size:18px}

/* ---------- call-to-action band */
.ctaband{background:var(--dark);color:#fff;border-top:3px solid var(--gold)}
.cta{display:flex;justify-content:space-between;align-items:center;gap:28px 40px;flex-wrap:wrap;padding-block:clamp(40px,6vw,72px)}
.cta .stack{gap:10px}
.cta .lede{color:var(--ondark)}
.cta-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cta-r .small{color:var(--ondark);width:100%}

/* ---------- footer */
.ftr{background:var(--darker);color:#fff;border-top:3px solid var(--gold)}
.ftr-grid{display:grid;grid-template-columns:1.5fr 1fr 1.2fr;gap:clamp(28px,5vw,64px);padding-block:48px 36px}
.ftr .brand{padding:0}
.ftr .brand svg.logo{width:60px;height:60px}
.ftr .b1{font-size:24px}
.ftr .b2{font-size:11px}
.ftr h4{font:700 20px/1 var(--font-head);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.ftr ul{list-style:none;display:grid;gap:8px}
.ftr a{text-decoration:none}
.ftr li a:hover{color:var(--gold)}
.fmuted{color:var(--mdark)}
.ftr .btn{border-color:#fff;color:#fff}
.ftr .btn:hover{background:#fff;color:var(--dark)}
.legal{border-top:1px solid var(--dline);padding-block:20px 28px;color:var(--mdark);font-size:15px}
.copyline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.copyline code{font:500 15px/1.4 var(--font-mono);background:var(--soft);border:1px solid var(--sage);padding:7px 10px;color:var(--ink);word-break:break-all}
.ftr .copyline code{background:var(--dark2);border-color:var(--dline);color:#fff}

/* ---------- forms */
input[type=text],input[type=email],input[type=url],input[type=number],select,textarea{width:100%;font:400 17px/1.4 var(--font-body);color:var(--ink);background:#fff;border:1px solid var(--field);border-radius:0;padding:12px 14px;min-height:50px}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:3px solid var(--gold);outline-offset:0;border-color:var(--dark)}
.f{display:grid;gap:6px;font-weight:700;align-content:start}
.hint{font-weight:400;color:var(--muted);font-size:15px;line-height:1.45}
fieldset{border:1px solid var(--sage);padding:14px 16px}
legend{font-weight:700;padding-inline:6px}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{display:flex;gap:8px;align-items:center}

/* ---------- white cards with a soft header band */
.pcard{background:#fff;border:1px solid var(--sage);border-radius:2px;min-width:0}
.pcard>header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:17px 24px;background:var(--soft);border-bottom:1px solid var(--sage)}
.pcard>header h3{font:800 28px/1 var(--font-head);text-transform:uppercase;letter-spacing:.005em;display:flex;align-items:center;gap:14px}
.qn{width:34px;height:34px;border-radius:50%;background:var(--dark);color:#fff;font:700 19px/1 var(--font-head);display:grid;place-items:center;flex:none}
.pbody{padding:24px;display:grid;gap:14px;align-content:start}
.pintro{padding:18px 24px;color:var(--muted);border-bottom:1px solid var(--sage)}
.opts{display:grid}
.opt{display:flex;align-items:center;gap:16px;padding:17px 24px;border-top:1px solid var(--sage);cursor:pointer;position:relative}
.opts>.opt:first-child{border-top:0}
.opt input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--dark);cursor:pointer}
.opt .grow{display:grid;gap:2px}
.opt b{font-weight:700;font-size:19px;line-height:1.3}
.opt .muted{line-height:1.4}
.opt .p{font:700 24px/1 var(--font-head);letter-spacing:.02em;white-space:nowrap}
.opt:has(input:checked){background:var(--soft);box-shadow:inset 5px 0 0 var(--gold)}
.opt:hover{background:var(--soft)}
.opt:focus-within{outline:3px solid var(--gold);outline-offset:-3px}

/* ---------- quote builder */
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,420px);gap:clamp(28px,4vw,52px);align-items:start}
.qside{display:grid;gap:20px;align-content:start}
.quote .total{font:800 clamp(58px,6vw,80px)/.95 var(--font-head);letter-spacing:.005em}
.quote .tsub{font:600 15px/1.3 var(--font-mono);margin-top:-6px}
.quote dl{display:grid;border-top:1px solid color-mix(in srgb,var(--ongold) 30%,transparent);margin-top:6px}
.quote dl>div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--ongold) 30%,transparent)}
.quote dt{font-weight:600}
.quote dd{font-weight:700;text-align:right}
.qbtns{display:grid;gap:10px;margin-top:4px}
.know{display:grid;gap:12px;align-content:start}
.know p{color:var(--muted);font-size:18px;line-height:1.5}
@media (min-width:1041px) and (min-height:880px){.qside{position:sticky;top:var(--stick)}}

/* ---------- contact */
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.cols2.cc{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),600px))}
.cols2.four{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.handle{font:800 clamp(30px,3.4vw,44px)/1.05 var(--font-head);overflow-wrap:anywhere}
.ccard.todo{border-style:dashed;border-color:var(--dark)}
.msgbox pre{font:500 15px/1.65 var(--font-mono);background:var(--soft);border:1px solid var(--sage);padding:16px 18px;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- gallery */
.gal-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,390px);gap:clamp(28px,4vw,52px);align-items:start}
.feed{display:grid;gap:24px;align-content:start;min-width:0}
.post{padding:0;overflow:hidden}
.post>header{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--soft);border-bottom:1px solid var(--sage)}
.av{width:44px;height:44px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;flex:none}
.av svg{width:26px;height:26px}
.who{display:grid;flex:1;min-width:0}
.who b{font:700 21px/1.1 var(--font-head);letter-spacing:.02em}
.post .pbody{padding:20px}
.cap{white-space:pre-wrap;overflow-wrap:anywhere}
.pimgs{display:grid;gap:8px}
.pimgs.n2,.pimgs.n3,.pimgs.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.pimg{padding:0;border:1px solid var(--sage);background:#fff;cursor:zoom-in;display:block;overflow:hidden;line-height:0}
.pimg img{display:block;width:100%;height:auto}
.pimgs.n2 .pimg img,.pimgs.n3 .pimg img,.pimgs.n4 .pimg img{aspect-ratio:16/10;object-fit:cover}
.pimg:hover{border-color:var(--dark)}
.composer{display:grid;gap:14px}
.composer h3,.agroup>h3,.agroup>.row.between h3{font:800 28px/1 var(--font-head);text-transform:uppercase}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumb{position:relative;width:96px;height:96px;border:1px solid var(--sage)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;background:var(--dark);color:#fff;display:grid;place-items:center;cursor:pointer}
.thumb button .ico{width:14px;height:14px}
.empty{display:grid;justify-items:start;gap:12px;padding:32px}
.gthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.gthumb{display:block;padding:0;overflow:hidden;text-decoration:none;position:relative}
.gthumb img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.gthumb:hover{border-color:var(--dark)}
.gcap{display:block;padding:12px 16px;font-weight:600;font-size:16px;border-top:1px solid var(--sage)}
.card.todo{border:1px dashed var(--dark);background:var(--soft);display:grid;gap:10px;justify-items:start}
.card.todo h3{font:800 26px/1.05 var(--font-head);text-transform:uppercase}

/* ---------- lightbox, toast, notice */
.lb{position:fixed;inset:0;z-index:100;display:grid;grid-template-rows:minmax(0,1fr) auto;background:color-mix(in srgb,var(--darker) 96%,transparent);color:#fff;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb-stage{display:grid;place-items:center;min-height:0;padding-top:2.5rem}
.lb-stage img{max-width:100%;max-height:calc(100dvh - 10rem);object-fit:contain;border:1px solid var(--dline);background:#fff}
.round{width:46px;height:46px;display:grid;place-items:center;border:2px solid #fff;background:rgba(0,0,0,.45);color:#fff;cursor:pointer;border-radius:0}
.round:hover{background:#fff;color:var(--dark)}
.lb-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.lb-b{position:absolute;top:50%;transform:translateY(-50%)}
.lb-b.prev{left:calc(10px + env(safe-area-inset-left,0px))}
.lb-b.next{right:calc(10px + env(safe-area-inset-right,0px))}
.lb-cap{text-align:center;padding:.8rem;color:var(--ondark);display:grid;gap:.3rem;max-width:70ch;margin-inline:auto}
.lb-cap p{color:#fff}
.lb-n{font:500 .85rem var(--font-mono)}
.notice{padding:16px 20px;background:var(--infobg);border:1px solid #BFD3F2;border-left:6px solid var(--infoink);color:var(--infoink);font-size:16px}
.notice.bad{background:#FEF2F0;border-color:#F3C2BC;border-left-color:var(--bad);color:#7A1A12}
.toast{position:fixed;z-index:110;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);background:var(--darker);color:#fff;border-left:5px solid var(--gold);padding:13px 20px;font-weight:600;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.3)}

/* ---------- season pill */
.spill{position:fixed;z-index:75;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;justify-items:end;gap:10px}
.spill>button{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 18px;border:2px solid var(--gold);border-radius:0;background:var(--darker);color:#fff;font:700 17px/1 var(--font-head);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.spill>button:hover{background:var(--dark2)}
.spill .dot{width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--gold) 0 33%,var(--sage) 0 66%,var(--mdark) 0)}
.spill .menu{width:min(300px,calc(100vw - 32px));padding:6px;border:1px solid var(--sage);background:#fff;box-shadow:0 12px 32px rgba(0,0,0,.28);display:grid}
.spill .menu p{font-size:14px;color:var(--muted);padding:8px 10px 10px}
.spill .menu button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 10px;border:0;border-left:4px solid transparent;background:none;color:var(--ink);font:600 17px var(--font-body);cursor:pointer}
.spill .menu button:hover{background:var(--soft)}
.spill .menu button[aria-pressed="true"]{background:var(--soft);border-left-color:var(--gold)}

/* ---------- admin */
.adm{display:grid;grid-template-columns:290px minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:start}
.atabs{display:grid;gap:2px;position:sticky;top:var(--stick)}
.glabel{font:800 25px/1 var(--font-head);text-transform:uppercase;padding:0 14px;margin:26px 0 8px}
.glabel:first-child{margin-top:0}
.atabs button{text-align:left;padding:13px 14px;border:0;border-radius:2px;background:none;color:var(--ink);font:500 18px/1.3 var(--font-body);cursor:pointer}
.atabs button:hover{background:var(--soft)}
.atabs button[aria-current="page"]{background:var(--dark2);color:#fff;font-weight:600}
.amain{min-width:0}
.ahead h1{font:800 clamp(42px,5vw,62px)/1 var(--font-head);text-transform:uppercase}
.ahead .lede{max-width:60ch}
.pubbar{position:sticky;top:var(--stick);z-index:20;display:flex;justify-content:space-between;align-items:center;gap:14px 20px;flex-wrap:wrap;background:#fff;border:1px solid var(--sage);border-left:6px solid var(--sage);padding:14px 18px}
.pubbar.dirty{border-left-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,#fff)}
.agroup{background:#fff;border:1px solid var(--sage);padding:24px;display:grid;gap:16px;align-content:start;min-width:0}
.agroup>h3:first-child,.agroup>.row.between:first-child{margin:-24px -24px 4px;padding:16px 24px;background:var(--soft);border-bottom:1px solid var(--sage)}
.agroup .composer{padding:0;border:0}
.agroup .opt{padding-inline:0;border-top:0}
.agroup .opt:has(input:checked){box-shadow:none;background:none}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.apane{display:grid;gap:24px;align-content:start;min-width:0}
.litem{border:1px solid var(--sage);background:var(--page);padding:16px;display:grid;gap:12px}
.litem>header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.litem>header b{overflow-wrap:anywhere}
.mini{display:flex;gap:6px;flex:none}
.mini button,.delbtn{min-width:38px;height:38px;border:1px solid var(--sage);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0 8px;font-weight:700;font-size:14px;border-radius:0}
.mini button:hover:not(:disabled),.delbtn:hover{border-color:var(--dark)}
.mini button:disabled{opacity:.35;cursor:not-allowed}
.mini .ico,.delbtn .ico{width:18px;height:18px}
.delbtn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.scard{display:grid;gap:12px;align-content:start;padding:0;overflow:hidden}
.scard>div,.scard>.row{padding-inline:16px}
.scard>.row{padding-bottom:16px}
.scard.live{border-color:var(--dark);box-shadow:inset 0 0 0 2px var(--dark)}
.checklist ul{list-style:none}
.checklist li{display:flex;align-items:flex-start;gap:16px;padding:20px 24px;border-top:1px solid var(--sage)}
.checklist li:first-child{border-top:0}
.cmark{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;margin-top:1px}
.cmark .ico{width:16px;height:16px;stroke-width:2.6}
.checklist .done .cmark{border-color:var(--ok);color:var(--ok)}
.cbody{flex:1;min-width:0;display:grid;gap:2px}
.cbody b{font-size:20px;font-weight:600;line-height:1.3}
.cbody .muted{line-height:1.45}
.checklist .done .cbody b{text-decoration:line-through}
.olist{padding-left:1.4rem;display:grid;gap:6px}
.tscroll{overflow-x:auto}
.roles{width:100%;border-collapse:collapse;font-size:16px;min-width:520px}
.roles th,.roles td{text-align:left;padding:10px 12px;border:1px solid var(--sage);vertical-align:top}
.roles th{background:var(--soft);font-weight:700}
.locked{max-width:640px;display:grid;gap:14px;justify-items:start;padding-block:24px}
.locked h1{font:800 clamp(40px,5vw,60px)/1 var(--font-head);text-transform:uppercase}

@keyframes ping{0%{box-shadow:0 0 0 0 rgba(60,224,143,.7)}80%,100%{box-shadow:0 0 0 8px transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- tablet and phone */
@media (max-width:1040px){
  .cards3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hdr{position:sticky;top:env(safe-area-inset-top,0px)}
  .hdr-in{display:flex;align-items:center;gap:12px;min-height:66px}
  .brand{flex:1;padding:8px 0;gap:12px}
  .brand svg.logo{width:50px;height:50px}
  .b1{font-size:23px}
  .b2{font-size:11px;letter-spacing:.18em}
  .hdr-tag,.uchip{display:none}
  .hdr-r{padding:0;gap:10px;align-items:center}
  .hcta{min-height:44px;padding:0 16px;font-size:18px}
  .hcta .ico{display:block}
  .hcta .more{display:none}
  .menu-btn{display:grid}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--darker);border-bottom:3px solid var(--gold);padding:8px max(var(--gut),env(safe-area-inset-right,0px)) 14px max(var(--gut),env(safe-area-inset-left,0px));box-shadow:0 16px 32px rgba(0,0,0,.35)}
  .nav.open{display:flex;flex-direction:column}
  .nav-main,.nav-util{display:contents}
  .nav a,.nav-main a,.nav-main a:first-child{padding:16px 4px;border-bottom:1px solid var(--dline);font-size:17px}
  .nav a[aria-current="page"]{color:var(--gold)}
  .nav a[aria-current="page"]::after{display:none}
  .nav-adm{display:flex!important;color:var(--gold)!important}
  .nav-adm.dirty::after{content:"";display:block;position:static;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-left:10px}
  .lband-in{grid-template-columns:1fr}
  .lcard,.lcard:first-child{padding:24px 0;border-left:0;border-top:1px solid var(--dline)}
  .lcard:first-child{border-top:0}
  .split-steps,.builder,.gal-split,.adm{grid-template-columns:1fr}
  .sticky{position:static}
  .sband{grid-template-columns:1fr}
  .ftr-grid{grid-template-columns:1fr 1fr}
  .ftr-grid>:first-child{grid-column:1 / -1}
  .atabs{position:static;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .atabs button{white-space:nowrap;border:1px solid var(--sage);background:#fff}
  .glabel{display:none}
  .banner p{text-align:left}
  .banner .ico+p{margin-right:0}
  .banner .wrap{align-items:flex-start}
}
@media (max-width:640px){.cards3{grid-template-columns:1fr}}
@media (max-width:560px){.moon{top:8px;right:12px;width:42px;box-shadow:0 0 36px 10px rgba(255,150,40,.3)}.sun{right:-24px;top:-30px;width:96px}}
@media (max-width:560px){
  body{font-size:16.5px}
  .hcta{display:none}
  .ftr-grid{grid-template-columns:1fr}
  .ctas .btn,.cta-r .btn,.phead-r .btn{width:100%}
  .phead-r{width:100%}
  .btn.lg{min-height:54px;padding:0 22px;font-size:20px}
  .pcard>header,.pbody,.pintro,.opt{padding-inline:18px}
  .opt{gap:12px}
  .gcard{padding:24px}
  .steps li{grid-template-columns:44px minmax(0,1fr);gap:16px}
  .num{width:44px;height:44px;font-size:21px}
  .steps li::before{left:21px;top:52px}
  .checklist li{flex-wrap:wrap;padding-inline:18px}
  .checklist .cbody{flex:1 1 calc(100% - 50px)}

// ======================================================================
// fx: seasonal particles on one fixed canvas (bats, leaves, snow, petals)
// ======================================================================
const FX = (() => {
  const PLAN = {
    halloween: [['bats', 6], ['embers', 22]],
    fall: [['leaves', 26]],
    christmas: [['snow', 70]],
    spring: [['petals', 20], ['pollen', 22]]
  };
  const reducedMq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  let cv = null, ctx = null, W = 0, H = 0, dpr = 1, parts = [], raf = 0, last = 0, season = 'regular', col = ['#fff', '#fff', '#fff'];
  const rnd = (a, b) => a + Math.random() * (b - a);

  function ensure() {
    if (cv) return true;
    cv = document.createElement('canvas');
    cv.id = 'fx';
    cv.setAttribute('aria-hidden', 'true');
    document.body.prepend(cv);
    ctx = cv.getContext('2d');
    if (!ctx) return false;
    size();
    window.addEventListener('resize', () => { clearTimeout(ensure.t); ensure.t = setTimeout(() => { size(); fill(); if (reducedMq.matches) paintStatic(); }, 150); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else go(); });
    new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-season', 'data-palette'] });
    if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
    return true;
  }
  function size() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    col = ['--fx1', '--fx2', '--fx3'].map(k => cs.getPropertyValue(k).trim() || '#fff');
  }
  function mk(kind, initial) {
    const x = rnd(0, W), y = initial ? rnd(0, H) : -24;
    switch (kind) {
      case 'snow': return { kind, x, y, r: rnd(1.2, 3.6), vy: rnd(24, 52), vx: rnd(-8, 8), ph: rnd(0, 6.28), c: Math.random() < 0.7 ? 0 : 1 };
      case 'leaves': return { kind, x, y, s: rnd(7, 13), vy: rnd(26, 58), vx: rnd(-14, 14), rot: rnd(0, 6.28), vr: rnd(-1.6, 1.6), ph: rnd(0, 6.28), c: Math.floor(rnd(0, 3)) };
      case 'petals': return { kind, x, y, s: rnd(4, 8), vy: rnd(18, 38), vx: rnd(-10, 14), rot: rnd(0, 6.28), vr: rnd(-1.2, 1.2), ph: rnd(0, 6.28) };
      case 'pollen': return { kind, x, y: initial ? rnd(0, H) : H + 10, r: rnd(1, 2.4), vy: -rnd(6, 16), vx: rnd(-6, 6), ph: rnd(0, 6.28) };
      case 'embers': return { kind, x, y: initial ? rnd(0, H) : H + 10, r: rnd(1.2, 2.8), vy: -rnd(14, 34), vx: rnd(-8, 8), ph: rnd(0, 6.28) };
      case 'bats': return { kind, x: initial ? rnd(-40, W) : -50, base: rnd(H * 0.05, H * 0.3), s: rnd(0.8, 1.35), vx: rnd(46, 96), ph: rnd(0, 6.28) };
      default: return null;
    }
  }
  function fill() {
    parts = [];
    const plan = PLAN[season];
    if (!plan || !cv) return;
    const k = Math.max(0.45, Math.min(1, (W * H) / (1300 * 800)));
    for (const [kind, n] of plan) for (let i = 0; i < Math.max(3, Math.round(n * k)); i++) parts.push(mk(kind, true));
  }
  function step(dt, t) {

      const p = parts[i];

        case 'snow': p.y += p.vy * dt; p.x += (p.vx + Math.sin(t + p.ph) * 14) * dt; if (p.y > H + 8) parts[i] = mk('snow', false); break;
        case 'leaves': p.y += p.vy * dt; p.x += (p.vx + Math.sin(t * 1.4 + p.ph) * 26) * dt; p.rot += p.vr * dt; if (p.y > H + 16) parts[i] = mk('leaves', false); break;
        case 'petals': p.y += p.vy * dt; p.x += (p.vx + Math.sin(t * 1.1 + p.ph) * 20) * dt; p.rot += p.vr * dt; if (p.y > H + 12) parts[i] = mk('petals', false); break;
        case 'pollen': p.y += p.vy * dt; p.x += Math.sin(t * 0.8 + p.ph) * 10 * dt; if (p.y < -10) parts[i] = mk('pollen', false); break;
        case 'embers': p.y += p.vy * dt; p.x += (p.vx + Math.sin(t * 1.6 + p.ph) * 10) * dt; if (p.y < -10) parts[i] = mk('embers', false); break;

      }
    }
  }
  function drawBat(p, t) {
    const y = p.base + Math.sin(t * 1.5 + p.ph) * 16;
    const f = Math.sin(t * 9 + p.ph);
    ctx.save(); ctx.translate(p.x, y); ctx.scale(p.s, p.s); ctx.fillStyle = col[0];
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(10, -12 * (0.4 + 0.6 * f), 24, -4 + 6 * f);
    ctx.quadraticCurveTo(17, 0, 12, 6); ctx.quadraticCurveTo(6, 3, 0, 8); ctx.quadraticCurveTo(-6, 3, -12, 6);
    ctx.quadraticCurveTo(-17, 0, -24, -4 + 6 * f); ctx.quadraticCurveTo(-10, -12 * (0.4 + 0.6 * f), 0, 0);

    ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(-3.4, -7.5); ctx.lineTo(-0.6, -4); ctx.moveTo(3, -3); ctx.lineTo(3.4, -7.5); ctx.lineTo(0.6, -4); ctx.fill();
    ctx.restore();
  }
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      switch (p.kind) {
        case 'snow': ctx.globalAlpha = 0.85; ctx.fillStyle = col[p.c]; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); break;
        case 'leaves':
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = 0.9; ctx.fillStyle = col[p.c];
          ctx.beginPath(); ctx.moveTo(0, -p.s); ctx.quadraticCurveTo(p.s * 0.95, -p.s * 0.2, 0, p.s); ctx.quadraticCurveTo(-p.s * 0.95, -p.s * 0.2, 0, -p.s); ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, -p.s * 0.8); ctx.lineTo(0, p.s * 1.15); ctx.stroke();
          ctx.restore(); break;
        case 'petals':
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = 0.85; ctx.fillStyle = col[0];
          ctx.beginPath(); ctx.ellipse(0, 0, p.s * 0.55, p.s, 0, 0, 6.283); ctx.fill(); ctx.restore(); break;
        case 'pollen': ctx.globalAlpha = 0.55 + 0.35 * Math.sin(t * 2 + p.ph); ctx.fillStyle = col[1]; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); break;
        case 'embers': ctx.globalAlpha = Math.max(0.15, Math.min(0.9, p.y / H + 0.2)); ctx.fillStyle = col[1]; ctx.shadowColor = col[1]; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0; break;
        case 'bats': ctx.globalAlpha = 0.9; drawBat(p, t); break;
      }
    }
    ctx.globalAlpha = 1;
  }
  function frame(ts) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (ts - last) / 1000 || 0);

    draw(ts / 1000);
  }
  function paintStatic() { if (cv) draw(0); }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
  function go() { if (raf || !parts.length || reducedMq.matches || document.hidden) return; last = performance.now(); raf = requestAnimationFrame(frame); }

  return {
    update(id) {
      season = id;
      const enabled = PLAN[id] && S.season.fx !== false;
      stop();
      if (!enabled) { if (cv) ctx.clearRect(0, 0, W, H); parts = []; return; }
      if (!ensure()) return;
      readColors();
      fill();
      if (reducedMq.matches) paintStatic(); else go();
    }
  };
})();

// ======================================================================
// gallery: a channel-style feed. Only people with Edit access can post.
// Pictures are shrunk in the browser and stored inside the page itself.
// ======================================================================
const MAX_PER_POST = 4;
const MAX_GALLERY_CHARS = 10000000;
const galleryChars = () => S.posts.reduce((n, p) => n + (p.imgs || []).reduce((m, i) => m + String(i.src || '').length, 0), 0);
const galleryMB = () => (galleryChars() / 1000000).toFixed(1);
const fmtDate = iso => {
  const d = new Date(String(iso) + 'T12:00:00');
  return isNaN(d) ? '' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
};

function readImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('unreadable image')); };
    im.src = url;
  });
}
async function compressImage(file) {
  const im = await readImage(file);
  let max = 1400, q = 0.82, out = null;
  for (let i = 0; i < 4; i++) {
    const sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.max(1, Math.round(im.naturalWidth * sc)), hh = Math.max(1, Math.round(im.naturalHeight * sc));
    const c = document.createElement('canvas');
    c.width = w; c.height = hh;
    const x = c.getContext('2d');
    x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, w, hh);
    x.drawImage(im, 0, 0, w, hh);
    out = { src: c.toDataURL('image/jpeg', q), w, h: hh };
    if (out.src.length < 600000) break;
    max = Math.round(max * 0.8); q = Math.max(0.6, q - 0.06);
  }
  return out;
}

// ---------------------------------------------------------------- composer (people with Edit access)
const COMP = { caption: '', imgs: [], busy: false, err: '' };
function composer(redraw) {
  const box = h('section', { class: 'card composer', 'aria-label': 'New gallery post' });
  async function addFiles(files) {
    COMP.err = '';
    const room = MAX_PER_POST - COMP.imgs.length;
    const imgs = files.filter(f => /^image\//.test(f.type));
    if (files.length && !imgs.length) COMP.err = 'Choose picture files, like PNG, JPG or WebP.';
    else if (imgs.length > room) COMP.err = 'Up to ' + MAX_PER_POST + ' pictures per post. Extra pictures were skipped.';
    COMP.busy = true; draw();
    for (const f of imgs.slice(0, Math.max(0, room))) {
      try { COMP.imgs.push(await compressImage(f)); }
      catch (e) { COMP.err = 'One picture could not be read. Try a PNG or JPG.'; }
    }
    COMP.busy = false; draw();
  }
  function post() {
    const caption = COMP.caption.trim();
    if (!caption && !COMP.imgs.length) return;
    const add = COMP.imgs.reduce((n, i) => n + i.src.length, 0);
    if (galleryChars() + add > MAX_GALLERY_CHARS) { COMP.err = 'The gallery is full (about ' + (MAX_GALLERY_CHARS / 1000000) + ' MB). Delete an older post first.'; draw(); return; }
    S.posts.unshift({ id: 'p' + Date.now().toString(36), date: new Date().toISOString().slice(0, 10), caption, imgs: COMP.imgs.map(i => ({ src: i.src, w: i.w, h: i.h })) });
    COMP.caption = ''; COMP.imgs = []; COMP.err = '';
    markDirty();
    toast('Added to the gallery. Press Publish changes to make it live.');
    redraw();
  }
  function draw() {
    const cap = h('textarea', { id: 'g-caption', rows: 3, maxlength: 600, placeholder: 'Say something about this site (optional)', 'aria-label': 'Caption', value: COMP.caption });
    cap.addEventListener('input', () => { COMP.caption = cap.value; ok.disabled = COMP.busy || (!cap.value.trim() && !COMP.imgs.length); });
    const file = h('input', { id: 'g-file', type: 'file', accept: 'image/*', multiple: true, hidden: true });
    file.addEventListener('change', () => { const fl = Array.from(file.files); file.value = ''; addFiles(fl); });
    const ok = h('button', { class: 'btn primary', type: 'button', id: 'g-post', disabled: COMP.busy || (!COMP.caption.trim() && !COMP.imgs.length), onclick: post }, 'Post to gallery');
    box.replaceChildren(...[
      h('div', { class: 'row between' }, h('h3', {}, 'New post'), h('span', { class: 'small muted mono' }, galleryMB() + ' of ' + (MAX_GALLERY_CHARS / 1000000) + ' MB used')),
      cap,
      COMP.imgs.length ? h('div', { class: 'thumbs' }, COMP.imgs.map((im, i) => h('div', { class: 'thumb' }, h('img', { src: im.src, alt: 'Picture ' + (i + 1) + ' to post' }),
        h('button', { type: 'button', 'aria-label': 'Remove picture ' + (i + 1), onclick: () => { COMP.imgs.splice(i, 1); COMP.err = ''; draw(); } }, icon('close'))))) : null,
      COMP.err ? h('p', { class: 'notice bad', role: 'alert' }, COMP.err) : null,
      h('div', { class: 'row' },
        h('button', { class: 'btn', type: 'button', disabled: COMP.busy || COMP.imgs.length >= MAX_PER_POST, onclick: () => file.click() }, icon('image'), COMP.busy ? 'Adding...' : 'Add pictures'),
        file, ok,
        h('span', { class: 'small muted' }, 'Pictures are shrunk automatically. Up to ' + MAX_PER_POST + ' per post.'))].filter(Boolean));
  }
  draw();
  return box;
}

// ---------------------------------------------------------------- lightbox
function openLightbox(post, start, opener) {
  const imgs = post.imgs || [];
  let idx = start;
  const old = $('.lb'); if (old) old.remove();
  const img = h('img', { alt: 'Website picture' });
  const cnt = h('span', { class: 'lb-n' });
  const prev = h('button', { class: 'round lb-b prev', type: 'button', 'aria-label': 'Previous picture', onclick: e => { e.stopPropagation(); go(-1); } }, icon('left'));
  const next = h('button', { class: 'round lb-b next', type: 'button', 'aria-label': 'Next picture', onclick: e => { e.stopPropagation(); go(1); } }, icon('right'));
  const x = h('button', { class: 'round lb-x', type: 'button', 'aria-label': 'Close picture viewer', onclick: close }, icon('close'));
  const lb = h('div', { class: 'lb', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Picture viewer', onclick: e => { if (e.target === lb || e.target === stage) close(); } });
  const stage = h('div', { class: 'lb-stage' }, img);
  lb.append(stage, x, prev, next, h('div', { class: 'lb-cap' }, post.caption ? h('p', {}, post.caption) : null, cnt));
  function show() { img.src = imgs[idx].src; cnt.textContent = imgs.length > 1 ? (idx + 1) + ' / ' + imgs.length : ''; prev.hidden = next.hidden = imgs.length < 2; }
  function go(d) { idx = (idx + d + imgs.length) % imgs.length; show(); }
  function onKey(e) {
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft' && imgs.length > 1) go(-1);
    else if (e.key === 'ArrowRight' && imgs.length > 1) go(1);
  }
  function close() { lb.remove(); document.removeEventListener('keydown', onKey); if (opener && opener.isConnected) opener.focus(); }
  document.addEventListener('keydown', onKey);
  document.body.append(lb);
  show();
  x.focus();
}

// ---------------------------------------------------------------- publish
function buildDoc() {
  const css = $('#app-style').textContent;
  const js = $('#app-script').textContent;
  if (!css || js.length < 5000 || js.indexOf('function buildDoc') < 0) throw Object.assign(new Error('page source unavailable'), { code: 'source_missing' });
  const data = JSON.stringify(S).split('<').join('\\u003c').split(String.fromCharCode(0x2028)).join('\\u2028').split(String.fromCharCode(0x2029)).join('\\u2029');
  const name = String(S.brand.name || 'Website').replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
  const close = '</' + 'script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' +
    (RESET_CSS || DEFAULT_RESET) + '</style></head><body>\n' +
    '<title>' + name + '</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="' + FONT_URL + '">\n' +
    '<style id="app-style">' + css + '</style>\n<script type="application/json" id="site-data">' + data + close + '\n<div id="app"></div>\n' +
    '<script id="app-script">' + js + close + '\n\n</body></html>';
}
function saveDraftNow() { clearTimeout(draftTimer); saveDraft(); }
async function publishNow() {
  if (ST.publishing) return;
  if (!ST.cap) { ST.msg = 'Publishing is not available in this view. Open the site from your own Claude account.'; ST.pubError = true; updatePubbar(); return; }
  ST.publishing = true; ST.msg = ''; ST.pubError = false;
  updatePubbar();
  try {
    saveDraftNow();
    const doc = buildDoc();
    await ST.cap.publish(doc);
    ST.msg = 'Published. The site is reloading with your changes.';
  } catch (e) {
    const code = e && e.code;
    ST.publishing = false; ST.pubError = true;
    if (['not_writer', 'not_granted', 'consent_required', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) {
      ST.readOnly = true; ST.msg = 'Your account cannot publish changes here. Ask the owner for Edit access.';
    } else if (code === 'conflict') ST.msg = 'A newer version was published first. The page is reloading. Your edits are kept as a draft you can restore.';
    else if (code === 'rate_limited') ST.msg = 'Publishing too often. Wait a minute, then publish once.';
    else if (code === 'too_large') ST.msg = 'The page is too large to publish. Delete some gallery posts and try again.';
    else if (code === 'source_missing') ST.msg = 'The page could not read its own source, so nothing was published. Ask Claude to apply your changes.';
    else ST.msg = 'Publishing failed. Try once more.';
  }
  updatePubbar();
}

// ---------------------------------------------------------------- form helpers
const aid = p => 'a-' + p.replace(/\./g, '-');
function aField(path, label, o = {}) {
  const id = aid(path), t = o.type || 'text', cur = pget(S, path);
  let el;
  if (t === 'area' || t === 'lines') el = h('textarea', { id, rows: o.rows || 3 });
  else if (t === 'select') el = h('select', { id }, (typeof o.options === 'function' ? o.options() : o.options).map(([v, l]) => h('option', { value: v }, l)));
  else el = h('input', { id, type: t, step: t === 'number' ? (o.step || 'any') : null, min: t === 'number' ? '0' : null, maxlength: o.max || null, autocomplete: 'off' });
  el.value = t === 'lines' ? (cur || []).join('\n') : (cur == null ? '' : cur);
  el.addEventListener('input', () => {
    let v = el.value;
    if (t === 'number') v = v === '' ? '' : +v;
    if (t === 'lines') v = v.split('\n').map(s => s.trim()).filter(Boolean);
    pset(S, path, v);
    markDirty();
    if (o.after) o.after(v);
  });
  return h('label', { class: 'f', for: id }, label, el, o.hint ? h('span', { class: 'hint' }, o.hint) : null);
}
function aCheck(path, label, hint) {
  const id = aid(path);
  const el = h('input', { id, type: 'checkbox' });
  el.checked = !!pget(S, path);
  el.addEventListener('change', () => { pset(S, path, el.checked); markDirty(); });
  return h('label', { class: 'opt', for: id }, el, h('span', { class: 'grow' }, h('b', {}, label), hint ? h('span', { class: 'muted small' }, hint) : null));
}
function aMulti(path, label, options) {
  const arr = pget(S, path) || [];
  return h('fieldset', {}, h('legend', {}, label), h('div', { class: 'checks' }, options.map(([v, l]) => {
    const id = aid(path) + '-' + v;
    const el = h('input', { id, type: 'checkbox' });
    el.checked = arr.includes(v);
    el.addEventListener('change', () => {
      const cur = new Set(pget(S, path) || []);
      if (el.checked) cur.add(v); else cur.delete(v);

  })));
}
function fieldFor(f, path) {

}

async function initCaps() {
  let u = null;
  try { u = await (window.claude && window.claude.use ? window.claude.use('user') : null); } catch (e) { u = null; }
  if (u) {
    try { ST.owner = !!(await u.isOwner()); ST.admin = ST.owner || !!(await u.canEdit()); } catch (e) { /* stay a visitor */ }
  }
  try { ST.cap = (await (window.claude && window.claude.use ? window.claude.use('artifact') : null)) || null; } catch (e) { ST.cap = null; }
  if (!ST.admin) return;
  const raw = ls.get(DRAFT_KEY);
  if (raw) {
    if (raw === SAVED.json) ls.del(DRAFT_KEY);
    else { try { ST.draft = JSON.parse(raw); } catch (e) { ls.del(DRAFT_KEY); } }
  }
  if (!ST.cap) ST.msg = 'Publishing is not available in this view. Open the site from your own Claude account.';
  renderAll();
}
